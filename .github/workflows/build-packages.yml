name: Build XBX2Unity Unity packages

on:
  push:
    branches:
      - main
      - feature/unity-map-extractor-package
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify GX2 MTXT address regression
        run: python tools/test_gx2_address.py
      - name: Validate Skell source texture role selection
        run: python tools/test_skell_color_selection.py
      - name: Validate CAMDO material workflow source contracts
        run: python tools/test_material_workflow.py
      - name: Check Skell native role/paint contracts
        run: python tools/test_skell_layers.py
      - name: Validate BC1 source channels and diagnostic binding
        run: python tools/test_skell_paint_channels.py
      - name: Build UPM ZIP and unitypackage
        run: python tools/build_unitypackage.py
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: XBX2Unity-packages
          path: dist/
          if-no-files-found: error
